<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Голосование</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Голосование">
  <link rel="stylesheet" href="style.css?v=11">
</head>
<body>
  <div class="container">
    <header>
      <h1>🗳 Школьное голосование</h1>
      <p class="question" id="questionText">Загрузка...</p>
    </header>

    <div id="timerDisplay" class="timer-display"></div>

    <div id="loadingState" class="loading">Загрузка голосования</div>

    <div id="content" class="hidden">
      <div id="messageBox" class="message-box"></div>
      <div id="optionsGrid" class="options-grid"></div>
      <div id="statusBar" class="status-bar" style="display:none">
        <span>Всего проголосовало: <strong id="totalCount">0</strong></span>
        <span>🟢</span>
      </div>
      <div id="errorMessage" class="error-message"></div>
    </div>
  </div>

  <div id="classPickerOverlay" class="name-overlay">
    <div class="name-card">
      <div class="name-card-icon">🏫</div>
      <h2>Выберите свой класс</h2>
      <div id="classPickerList" class="class-picker-list"></div>
      <div id="classPickerError" class="name-error"></div>
    </div>
  </div>

  <div id="nameOverlay" class="name-overlay">
    <div class="name-card">
      <div class="name-card-icon">✏️</div>
      <h2>Как тебя зовут?</h2>
      <p>Введи имя, чтобы учитель видел, кто проголосовал</p>
      <input type="text" id="nameInput" maxlength="20" placeholder="Имя" autocomplete="off" spellcheck="false">
      <button id="nameSubmitBtn">Продолжить</button>
      <div id="nameError" class="name-error"></div>
    </div>
  </div>

  <div id="pinOverlay" class="name-overlay">
    <div class="name-card">
      <div class="name-card-icon">🔑</div>
      <h2>Введи PIN-код</h2>
      <p>PIN-код показывается на проекторе</p>
      <input type="text" id="pinInput" maxlength="6" placeholder="PIN" autocomplete="off" inputmode="numeric" pattern="[0-9]*" style="letter-spacing:8px;font-weight:700;font-size:24px;">
      <button id="pinSubmitBtn">Подтвердить</button>
      <div id="pinError" class="name-error"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1"></script>
  <script src="firebase-config.js?v=11"></script>
  <script src="app.js?v=11"></script>
  <script>setupGlobalErrorHandler();</script>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
</body>
</html>
